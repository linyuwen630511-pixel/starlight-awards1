<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="ivory">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>管理者控制台｜星光榮耀</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="page">
    <div class="topbar-wrap">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="星光榮耀首頁">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="brandGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecd29b"/><stop offset=".55" stop-color="#c9a052"/><stop offset="1" stop-color="#a87a2c"/></linearGradient></defs><path d="M16 1c1.2 8.6 6.4 13.8 15 15-8.6 1.2-13.8 6.4-15 15-1.2-8.6-6.4-13.8-15-15C9.6 14.8 14.8 9.6 16 1z"/></svg>
        <b>星光榮耀</b><span class="divider"></span><span class="it">Admin Console</span>
      </a>
      
      <nav class="top-actions">
        <span id="modeBadge" class="mode-badge" hidden></span>
        <button class="icon-btn" data-ui="music" aria-label="輕鬆背景音樂">♫</button>
        <button class="icon-btn" data-ui="sound" aria-label="音效開關">🔊</button>
        <button class="icon-btn" data-ui="theme" aria-label="切換主題">☾</button>
      </nav>
    </header>
    </div>
    <main id="app" class="container" aria-live="polite">
      <p class="muted">載入中…</p>
    </main>
  </div>
    <script>
    // 載入診斷：若 8 秒後仍停在「載入中」，顯示可能原因
    window.__loadErrors = [];
    addEventListener("error", function (e) { window.__loadErrors.push((e.message || "") + " " + (e.filename || (e.target && (e.target.src || e.target.href)) || "")); }, true);
    addEventListener("unhandledrejection", function (e) { window.__loadErrors.push(String(e.reason && (e.reason.code || e.reason.message) || e.reason)); });
    setTimeout(function () {
      var app = document.getElementById("app");
      if (app && app.textContent.indexOf("載入中") > -1) {
        app.innerHTML = '<div class="card" style="max-width:640px;margin:6vh auto"><h2>頁面無法載入</h2>' +
          '<p>可能原因：</p><ol><li><b>config.js 格式錯誤</b>：請檢查每行結尾的逗號、英文半形雙引號，以及 databaseURL 後面不可有斷行的註解。</li>' +
          '<li><b>檔案沒有上傳齊全</b>：config.js、store.js、ui.js、rules.js、admin.js 等檔案需與 admin.html 在同一層。</li>' +
          '<li>網路無法連到 gstatic.com（Firebase 程式庫）。</li></ol>' +
          (window.__loadErrors.length ? '<p style="font-size:13px;color:#a33">錯誤訊息：' + window.__loadErrors.join("；").replace(/</g, "&lt;") + '</p>' : '') + '</div>';
      }
    }, 8000);
  </script>
  <script src="qrcode.js"></script>
  <script src="html2canvas.min.js" defer></script>
  <script src="jspdf.umd.min.js" defer></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
